<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <g id="fish">
      <!-- body -->
      <path d="M20,60 C60,20 200,22 260,48 L300,34 L292,60 L300,86 L260,72 C200,98 60,100 20,60 z" fill="#b8a77a" stroke="#6b5d3a" stroke-width="2"/>
      <!-- dorsal finlets -->
      <path d="M110,30 l8,-12 l6,11 M140,28 l8,-12 l6,11 M170,29 l8,-12 l6,11 M200,33 l8,-12 l6,11" fill="none" stroke="#6b5d3a" stroke-width="2"/>
      <!-- pectoral fin -->
      <path d="M78,76 q12,26 34,24 q-8,-14 -18,-26 z" fill="#a8976a" stroke="#6b5d3a" stroke-width="1.5"/>
      <circle cx="42" cy="54" r="4" fill="#1f2937"/>
    </g>
  </defs>

  <rect width="800" height="450" rx="18" fill="#f8fafc"/>

  <!-- Water panel -->
  <rect x="20" y="20" width="370" height="330" rx="14" fill="#e0f2fe"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0c4a6e">水中</text>
  <text x="92" y="52" font-size="15" fill="#0369a1">In water</text>
  <g transform="translate(45,120)"><use href="#fish"/></g>
  <!-- gill (active) -->
  <circle cx="115" cy="178" r="17" fill="#f43f5e" opacity=".9"/>
  <text x="115" y="183" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">エラ</text>
  <!-- kidney -->
  <ellipse cx="235" cy="170" rx="24" ry="11" fill="#7c3aed" opacity=".55"/>
  <text x="235" y="150" font-size="13" fill="#4c1d95" text-anchor="middle">腎臓</text>
  <!-- arrows at gill -->
  <line x1="70" y1="258" x2="104" y2="198" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="40" y="280" font-size="16" fill="#0f172a">Na⁺ 取り込み</text>
  <line x1="130" y1="198" x2="170" y2="258" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="150" y="280" font-size="16" fill="#0f172a">NH₃ 排泄</text>
  <text x="40" y="325" font-size="15" fill="#0c4a6e">エラがイオン調節・アンモニア排泄を担う</text>

  <!-- Land panel -->
  <rect x="410" y="20" width="370" height="330" rx="14" fill="#fef3c7"/>
  <text x="430" y="52" font-size="22" font-weight="700" fill="#78350f">陸上</text>
  <text x="482" y="52" font-size="15" fill="#b45309">On land</text>
  <path d="M410,240 L780,240 L780,336 Q780,350 766,350 L424,350 Q410,350 410,336 z" fill="#d6b77a" opacity=".45"/>
  <g transform="translate(435,120)"><use href="#fish"/></g>
  <!-- gill (reduced) -->
  <circle cx="505" cy="178" r="17" fill="#94a3b8"/>
  <text x="505" y="183" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">エラ</text>
  <path d="M488,161 L522,195 M522,161 L488,195" stroke="#dc2626" stroke-width="3"/>
  <!-- kidney (upregulated) -->
  <ellipse cx="625" cy="170" rx="30" ry="14" fill="#7c3aed" opacity=".85"/>
  <text x="625" y="148" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">腎臓</text>
  <line x1="625" y1="188" x2="625" y2="232" stroke="#0f766e" stroke-width="3" marker-end="url(#ahg)"/>
  <rect x="548" y="250" width="200" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="648" y="273" font-size="14.5" fill="#0f766e" text-anchor="middle" font-weight="700">ENaC ↑</text>
  <text x="648" y="294" font-size="13.5" fill="#0f766e" text-anchor="middle">アンモニア排泄チャネル ↑</text>
  <text x="430" y="330" font-size="15" fill="#78350f">エラの機能低下を腎臓が補う</text>

  <!-- transition arrow -->
  <line x1="372" y1="110" x2="428" y2="110" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/>

  <!-- bottom result -->
  <rect x="20" y="366" width="760" height="64" rx="14" fill="#0f766e"/>
  <text x="400" y="394" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">陸上でも血液中のイオン・浸透圧・アンモニアは一定に保たれる</text>
  <text x="400" y="417" font-size="13.5" fill="#ccfbf1" text-anchor="middle">Kimura et al. (2026) Am J Physiol Regul Integr Comp Physiol ― 内容をもとにした模式図</text>
</svg>
